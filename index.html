<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VidEdit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>VidEdit</h1>
    <label class="btn primary" for="fileInput">Import video</label>
    <input id="fileInput" type="file" accept="video/*,audio/*" hidden />
    <span id="fileName" class="muted">No file loaded</span>
  </header>

  <main>
    <section id="dropZone" class="drop-zone">
      <p>Drop a video here, or click <strong>Import video</strong>.</p>
    </section>

    <section id="editor" hidden>
      <video id="video" controls playsinline preload="metadata"></video>
      <div id="framePreview" class="frame-preview" hidden>
        <img id="frameImg" alt="Video frame at the playhead" />
        <span id="frameLoading" class="frame-loading">Loading picture…</span>
      </div>

      <div class="transport">
        <button id="playBtn" class="btn">Play</button>
        <span id="timeLabel" class="time">0:00.00 / 0:00.00</span>
        <label class="check"><input id="skipCuts" type="checkbox" checked /> Skip removed parts while playing</label>
      </div>

      <div class="zoom">
        <button id="zoomOutBtn" class="btn small" title="Shortcut: -">−</button>
        <button id="zoomInBtn" class="btn small" title="Shortcut: +">+</button>
        <button id="fitBtn" class="btn small" title="Shortcut: 0">Fit</button>
        <span id="zoomLabel" class="muted">Whole file</span>
        <span id="waveStatus" class="muted wave-status"></span>
      </div>
      <div id="timelineWrap" class="timeline-wrap">
        <canvas id="timeline"></canvas>
      </div>
      <input id="scroll" class="scroll" type="range" min="0" max="0" step="any" value="0" hidden />
      <p class="hint">Click the timeline to move the playhead and select a segment. Scroll the mouse wheel over it to zoom in for precise cuts.</p>

      <div class="tools">
        <button id="splitBtn" class="btn" title="Shortcut: S">Split at playhead</button>
        <button id="toggleBtn" class="btn" title="Shortcut: Delete">Remove / restore segment</button>
        <button id="trimStartBtn" class="btn" title="Shortcut: [">Trim start to playhead</button>
        <button id="trimEndBtn" class="btn" title="Shortcut: ]">Trim end to playhead</button>
        <button id="undoBtn" class="btn" title="Shortcut: Ctrl+Z">Undo</button>
        <button id="resetBtn" class="btn">Reset cuts</button>
      </div>

      <table class="segments">
        <thead><tr><th>#</th><th>Start</th><th>End</th><th>Length</th><th>Status</th></tr></thead>
        <tbody id="segmentList"></tbody>
      </table>

      <div class="export">
        <h2>Export audio</h2>
        <p id="summary" class="muted"></p>
        <label>Format
          <select id="format">
            <option value="mp3">MP3</option>
            <option value="wav">WAV</option>
          </select>
        </label>
        <label id="bitrateLabel">Bitrate
          <select id="bitrate">
            <option value="128">128 kbps</option>
            <option value="192" selected>192 kbps</option>
            <option value="320">320 kbps</option>
          </select>
        </label>
        <button id="exportBtn" class="btn primary">Export</button>
        <button id="cancelBtn" class="btn" hidden>Cancel</button>
        <progress id="exportProgress" max="1" hidden></progress>
        <span id="exportStatus" class="muted"></span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
